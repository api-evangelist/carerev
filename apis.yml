apis:
- aid: carerev:platform
  name: CareRev Platform API
  description: 'The private application and partner-integration API behind the CareRev
    platform. api.carerev.com is a live, TLS-terminated API gateway (Istio/Envoy fronting
    a Ruby application) that serves the CareRev clinician and facility applications
    and the partner integrations CareRev advertises on its partners page — importing
    and posting open shifts from a facility''s VMS, scheduling and HR systems such
    as UKG Dimensions. It is not a public, self-serve API: there is no developer portal,
    no published reference, no OpenAPI/Swagger/GraphQL/AsyncAPI contract, no sandbox
    and no public credential issuance. Access is arranged through a CareRev partnership
    or customer implementation. Recorded here as an observed, evidenced private API
    surface — nothing about its operations, parameters or auth model is asserted.'
  humanURL: https://www.carerev.com/partners
  baseURL: https://api.carerev.com
  tags:
  - Workforce Management
  - Staffing
  - Scheduling
  - Healthcare
  x-access: private
  x-contract: none-published
  x-evidence:
    fetched: '2026-08-02'
    url: https://api.carerev.com/
    http_status: 204
    note: 'Root returns HTTP 204 from server: istio-envoy with HSTS, CSP default-src
      ''none'', X-Runtime and X-Request-Id headers. All spec-discovery paths (/openapi.json,
      /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs, /redoc, /graphql,
      /.well-known/*) returned 404. app.carerev.com answers HTTP 200 with an HTML SPA
      shell for every path and is a catch-all false positive, not a spec host.'
