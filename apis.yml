aid: carerev
name: CareRev
description: 'CareRev is a healthcare workforce management and on-demand labor marketplace
  that connects hospitals and health systems directly with local, credentialed clinical
  professionals — registered nurses, LPN/LVNs, CNAs, surgical and ER techs, medical
  assistants, respiratory therapists, phlebotomists and mental health techs — without
  a traditional staffing agency in the middle. Facilities post open shifts from their
  existing scheduling and HR systems and vetted clinicians browse, claim and self-schedule
  them in the CareRev mobile app, while CareRev handles credential verification, compliance
  and payment. The product line spans the CareRev Marketplace (external on-demand talent),
  IRP+ (internal resource pool control and float-pool visibility for a health system''s
  own staff) and Smart Rates (dynamic rate modeling to control labor spend). CareRev
  is certified by The Joint Commission under its Health Care Staffing Services program
  and serves more than 650 facilities across the United States. Integration with a
  facility''s VMS, scheduling and workforce-management stack (including UKG Dimensions
  via the UKG Connect Technology Partner Program) is delivered through private, partner-scoped
  API connections; CareRev publishes no public developer portal, API documentation
  or machine-readable API contract as of this profiling pass.'
